<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="navBar">
      <div class="navLeft">
        <img src="" alt="" class="logo" />
        <a href="#">出發</a>
        <a href="#">登機</a>
        <a href="#">優惠</a>
        <a href="#">須知</a>
      </div>
      <nav class="navRight">
        <a href="#">航班搜尋</a>
        <a href="#">登入/註冊</a>
        <a href="#">繁中</a>
        <a href="#">TWD</a>
      </nav>
    </div>
    <div class="banner">
      <img src="" alt="" />
      <button class="right"></button><button class="left"></button>
    </div>
    <div class="card">
      <nav>
        <a href="#">航班</a>
        <a href="#">樂虎卡</a>
        <a href="#">虎加酒</a>
        <a href="#">虎里轉</a>
      </nav>
      <form action="#" method="get">
        <select name="flight">
          <option value="rt">來回</option>
          <option value="ow">單程</option>
          <option value="oj">不同點</option>
        </select>
        <div>
          <label for="star">出發地</label>
          <input type="text" id="star" />
          <label for="end">目的地</label>
          <input type="text" id="end" />
        </div>
        <div>
          <label for="starDate">去程出發日期</label>
          <input type="date" id="starDate" />
          <label for="endDate">回程出發日期</label>
          <input type="date" id="endDate" />
        </div>
        <label for="people">旅客人數</label>
        <select name="people" id="people"></select>
      </form>
      <div>
        <button>加入促銷代碼</button>
        <button>搜尋</button>
      </div>
    </div>
    <div>
      <a href="#">管理訂單</a>
      <a href="#">自動報到</a>
      <a href="#">航班動態</a>
      <a href="#">免稅品購買</a>
      <a href="#">常見問題</a>
    </div>
  </body>
</html>
