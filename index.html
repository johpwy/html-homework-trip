<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="index.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@main/css/iconoir.css"
    />
  </head>
  <body>
    <header>
      <div class="nav-left">
        <input type="checkbox" id="nav-toggle" class="nav-toggle" />
        <label for="nav-toggle" class="hambuger">
          <div class="iconoir-menu"></div>
        </label>
        <img src="https://picsum.photos/400/300" class="logo" />
        <nav>
          <ul>
            <li><h1>準備出發</h1></li>
            <li><a href="#">預定航班</a></li>
            <li><a href="#">搭乘航班</a></li>
            <li><h1>歡迎登機</h1></li>
            <li><a href="#">搭乘本公司</a></li>
            <li><h1>起飛折扣</h1></li>
            <li><a href="#">公司優惠</a></li>
            <li><h1>公司須知</h1></li>
            <li><a href="#">關於幫助</a></li>
          </ul>
        </nav>
      </div>
      <nav class="nav-right">
        <ul>
          <li class="iconoir-search">
            <a href="#">航班搜尋</a>
          </li>
          <li class="iconoir-user">
            <a href="#">登入/註冊</a>
          </li>
          <li class="iconoir-globe">
            <a href="#">繁中</a>
          </li>
          <li class="iconoir-dollar-circle">
            <a href="#">TWD</a>
          </li>
        </ul>
      </nav>
    </header>
    <div class="banner">
      <div>
        <div class="btn">
          <button class="left iconoir-nav-arrow-left"></button>
          <button class="right iconoir-nav-arrow-right"></button>
        </div>
      </div>
    </div>
    <div class="cards">
      <nav>
        <a href="#">航班</a>
        <a href="#">樂虎卡</a>
        <a href="#">虎加酒</a>
        <a href="#">虎里轉</a>
      </nav>
      <select class="flight" name="flight" id="flight">
        <option value="rt">來回</option>
        <option value="ow">單程</option>
        <option value="oj">不同點</option>
      </select>
      <div class="city">
        <label for="star"></label>
        <input type="text" id="star" name="star" value="出發地" />
        <label for="end"></label>
        <input type="text" id="end" name="end" value="目的地" />
      </div>
      <div class="date">
        <div>
          <label for="starDate">去程出發日期</label>
          <input type="date" id="starDate" name="starDate" />
        </div>
        <div>
          <label for="endDate">回程出發日期</label>
          <input type="date" id="endDate" name="endDate" />
        </div>
      </div>
      <div class="people">
        <label for="people">旅客人數</label>
        <select name="people" id="people" name="people"></select>
      </div>
      <div class="card-btn">
        <button class="iconoir-percent-rotate-out">加入促銷代碼</button>
        <button>搜尋</button>
      </div>
    </div>
    <div class="qa-btn">
      <a href="#" class="iconoir-page">管理訂單</a>
      <a href="#" class="iconoir-airplane">自動報到</a>
      <a href="#" class="iconoir-calendar">航班動態</a>
      <a href="#" class="iconoir-shop-four-tiles-window">免稅品購買</a>
      <a href="#" class="iconoir-help-circle">常見問題</a>
    </div>
  </body>
</html>
